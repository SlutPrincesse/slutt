[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-system-v9"
version = "9.0.0"
description = "NEURO-CRANIAL OVERLORD - Master Technical Architecture Specification & Consolidated Implementation Roadmap"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Agent System V9 Team", email = "dev@agent-system-v9.local"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core dependencies
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "aiokafka>=0.8",
    "httpx>=0.25",
    "redis>=5.0",
    "psutil>=5.9",
    "tenacity>=8.2",
    "msgpack>=1.0",
    "numpy>=1.24",

    # Tree-sitter for polyglot parsing
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-rust>=0.21",
    "tree-sitter-go>=0.21",
    "tree-sitter-java>=0.21",
    "tree-sitter-cpp>=0.21",

    # Document processing
    "python-docx>=1.1",
    "PyMuPDF>=1.23",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",

    # Serialization
    "orjson>=3.9",
]

optional-dependencies = {
    "ml" = [
        "sentence-transformers>=2.2",
        "llama-cpp-python>=0.2",
        "torch>=2.1",
        "transformers>=4.35",
        "accelerate>=0.24",
    ],
    "distributed" = [
        "aiokafka>=0.8",
        "kombu>=5.3",
        "pika>=1.3",
    ],
    "monitoring" = [
        "prometheus-client>=0.19",
        "opentelemetry-api>=1.21",
        "opentelemetry-sdk>=1.21",
        "opentelemetry-exporter-otlp>=1.21",
    ],
    "dev" = [
        "pytest>=7.4",
        "pytest-asyncio>=0.21",
        "pytest-cov>=4.1",
        "pytest-mock>=3.12",
        "pytest-xdist>=3.5",
        "mypy>=1.7",
        "ruff>=0.1",
        "black>=23.10",
        "isort>=5.12",
        "pre-commit>=3.6",
    ],
    "docs" = [
        "sphinx>=7.2",
        "sphinx-rtd-theme>=1.3",
        "myst-parser>=2.0",
    ],
    "full" = [
        "sentence-transformers>=2.2",
        "llama-cpp-python>=0.2",
        "torch>=2.1",
        "transformers>=4.35",
        "accelerate>=0.24",
        "aiokafka>=0.8",
        "kombu>=5.3",
        "pika>=1.3",
        "prometheus-client>=0.19",
        "opentelemetry-api>=1.21",
        "opentelemetry-sdk>=1.21",
        "opentelemetry-exporter-otlp>=1.21",
    ],
}

[project.urls]
Homepage = "https://github.com/agent-system-v9/agent-system-v9"
Repository = "https://github.com/agent-system-v9/agent-system-v9"
Issues = "https://github.com/agent-system-v9/agent-system-v9/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_system_v9*"]

[tool.setuptools.package-dir]
"agent_system_v9" = "agent_system_v9"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = false
follow_imports = "normal"
namespace_packages = true
explicit_package_bases = true
files = ["agent_system_v9"]
exclude = [
    "agent_system_v9/__pycache__",
    "agent_system_v9/**/__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]
# Per-module overrides for external libs without stubs
[[tool.mypy.overrides]]
module = [
    "aiokafka",
    "aiohttp",
    "redis",
    "psutil",
    "tree_sitter",
    "tree_sitter_python",
    "tree_sitter_javascript",
    "tree_sitter_typescript",
    "tree_sitter_rust",
    "tree_sitter_go",
    "tree_sitter_java",
    "tree_sitter_cpp",
    "sentence_transformers",
    "llama_cpp",
    "torch",
    "transformers",
    "accelerate",
    "prometheus_client",
    "opentelemetry",
    "orjson",
    "msgpack",
    "lxml",
    "bs4",
    "docx",
    "fitz",
    "openpyxl",
    "pptx",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
unsafe-fixes = false

# Formatter
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = true

# Linter
[tool.ruff.lint]
preview = true
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
    "NPY", # numpy
    "RET", # flake8-return
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex (allow for now)
    "SIM102", # use `if a and b` instead of nested `if`
    "SIM103", # use `return` instead of `else`
    "ARG001", # unused argument (common in callbacks)
    "ARG002", # unused argument (common in callbacks)
    "TRY003",  # avoid specifying long messages outside exception class
    "NPY002",  # numpy dtype
]
per-file-ignores = {
    "agent_system_v9/__init__.py" = ["F401", "F403", "I001"],  # many exports, unsorted imports
    "agent_system_v9/core/config.py" = ["C901", "PLR0915"],  # large config class
}

[tool.black]
target-version = ["py310"]
line-length = 100
include = "\\.pyi?$"
extend-exclude = '''
/(
  \\.venv
  | venv
  | build
  | dist
  | \\.git
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["agent_system_v9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "ml: Tests requiring ML dependencies",
]

[tool.coverage.run]
source = ["agent_system_v9"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/conftest.py",
]
branch = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
precision = 2

[tool.pre-commit]
repos = [
    {repo = "https://github.com/astral-sh/ruff-pre-commit", rev = "v0.1.0", hooks = [{id = "ruff", args = ["--fix", "--exit-non-zero-on-fix"]}]},
    {repo = "https://github.com/astral-sh/ruff-pre-commit", rev = "v0.1.0", hooks = [{id = "ruff-format"}]},
    {repo = "https://github.com/psf/black", rev = "23.10.1", hooks = [{id = "black"}]},
    {repo = "https://github.com/pycqa/isort", rev = "5.12.0", hooks = [{id = "isort"}]},
    {repo = "https://github.com/pre-commit/pre-commit-hooks", rev = "v4.5.0", hooks = [
        {id = "trailing-whitespace"},
        {id = "end-of-file-fixer"},
        {id = "check-yaml"},
        {id = "check-toml"},
        {id = "check-merge-conflict"},
        {id = "debug-logger"},
    ]},
]

[tool.pyright]
reportMissingImports = false
reportMissingTypeStubs = false
typeCheckingMode = "basic"

[tool.bandit]
exclude_dirs = ["tests", "__pycache__", "build", "dist"]
skips = ["B101", "B601"]