[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus"
version = "0.1.0"
description = "Unified AI Agent Infrastructure Platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Nexus Contributors" },
]
keywords = ["ai", "agent", "skill", "router", "browser", "dependency", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pyyaml>=6.0,<7.0",
    "tiktoken>=0.7,<1.0",
    "websockets>=12.0,<13.0",
    "packaging>=24,<25.0",
    "pathspec>=0.12,<0.13.0",
    "platformdirs>=4,<5.0",
    "uv>=0.11.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
discord = ["discord.py>=2.0.0", "pypdf>=5.0.0"]
web = ["ddgs"]
browser-llm = ["openai>=1.0,<2.0", "anthropic>=0.25,<1.0", "google-genai>=1.21.0,<2.0", "mcp>=2.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyright>=1.1",
    "build",
    "twine",
]

[project.scripts]
nexus = "nexus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nexus"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.envs.default]
dependencies = [
    "nexus[dev]",
]

[tool.hatch.envs.default.scripts]
test = "pytest tests/"
lint = "ruff check nexus/ tests/"
fmt = "ruff format nexus/ tests/"
typecheck = "mypy nexus/"
